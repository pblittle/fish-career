name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The required status check context is "test"; keep this job single-node so
  # the ruleset stays satisfied, and run the other supported versions in
  # compat below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix fish-career
      - run: npm test --prefix fish-career
      - run: npm run typecheck --prefix fish-career
      - run: npm run lint --prefix fish-career
      - run: npm run lint:md --prefix fish-career
      - run: npm run build --prefix fish-career
      - run: npm run verify:pack --prefix fish-career
      - run: npm run smoke --prefix fish-career
      - name: Inspector discovery and invocation
        run: |
          FISH_HOME=$(mktemp -d) npx -y @modelcontextprotocol/inspector --cli node fish-career/dist/index.js --method tools/list | tee /tmp/tools.json
          grep -q triage_postings /tmp/tools.json
          FISH_HOME=$(mktemp -d) npx -y @modelcontextprotocol/inspector --cli node fish-career/dist/index.js --method tools/call --tool-name profile_update --tool-arg "content=# CI smoke" | tee /tmp/call.json
          grep -q '"written": true' /tmp/call.json

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --prefix fish-career
      - run: npm test --prefix fish-career
      - run: npm run typecheck --prefix fish-career
      - run: npm run build --prefix fish-career

  commitlint:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix fish-career
      - run: fish-career/node_modules/.bin/commitlint --from ${{ github.event.pull_request.base.sha || 'origin/main' }} --to ${{ github.event.pull_request.head.sha || 'HEAD' }}
