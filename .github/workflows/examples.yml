name: examples

on:
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

jobs:
  langgraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci --prefix fish-career
      - run: npm run build --prefix fish-career
      - run: npm ci
        working-directory: examples/langgraph
      - run: npm run typecheck
        working-directory: examples/langgraph
      - run: npm test
        working-directory: examples/langgraph
