name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Bot-created PRs fire no workflow events (the GITHUB_TOKEN recursion
      # guard), so release PRs arrive with zero checks and the ruleset will
      # not let them merge. workflow_dispatch is the documented exception to
      # that guard: dispatch the checks onto the release branch's head.
      - name: Trigger checks on the release PR
        if: steps.release.outputs.release_created != 'true'
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --jq '[.[] | select(.head.ref | startswith("release-please"))][0].head.ref // empty')
          if [ -n "$ref" ]; then gh workflow run test.yml --ref "$ref"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # A release created by release-please carries the GITHUB_TOKEN, so the
  # `release: published` event in publish.yml never fires for it. Publish from
  # the same run instead, after the action reports the release exists.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
