name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A release PR arrives blocked either way: the bot-authored
      # pull_request event may not fire at all (the GITHUB_TOKEN recursion
      # guard), and when it does fire it arrives in action_required, which
      # leaves the head SHA pending and the ruleset refuses the merge.
      # Dispatch the checks onto the release branch's head, then approve the
      # gated run for that exact commit, so the release PR can merge on its
      # own. The approval is scoped to the PR head SHA because the release
      # branch is reused and a stale gated run on it must not be started.
      - name: Trigger checks on the release PR, and approve the gated run
        if: steps.release.outputs.release_created != 'true'
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --jq '[.[] | select(.head.ref | startswith("release-please"))][0].head.ref // empty')
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --jq '[.[] | select(.head.ref | startswith("release-please"))][0].head.sha // empty')
          [ -n "$ref" ] || exit 0
          gh workflow run test.yml --ref "$ref"
          for attempt in 1 2 3 4 5 6; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=action_required" --jq '.workflow_runs[].id')
            if [ -n "$ids" ]; then
              for id in $ids; do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null
              done
              exit 0
            fi
            sleep 5
          done
          echo "no gated run found to approve"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # A release created by release-please carries the GITHUB_TOKEN, so the
  # `release: published` event in publish.yml never fires for it. Publish from
  # the same run instead, after the action reports the release exists.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
